[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sigrif-demo"
version = "0.1.0"
description = "Demo funcional de SIGRIF Valparaiso"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.15,<1",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "boto3>=1.35,<2",
  "prometheus-client>=0.20,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=sigrif --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
