name: deploy-free-tier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "nginx/**"
      - "docker-compose.prod.yml"
      - "scripts/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-free-tier
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build

  deploy:
    needs: quality
    # La cuenta actual bloquea iam:CreateOpenIDConnectProvider por SCP.
    # El despliegue de la entrega se hace por SSM; activar esta variable
    # cuando la organización permita OIDC o exista otro mecanismo.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        run: |
          docker buildx build --push \
            -t "$IMAGE_PREFIX/backend:${{ github.sha }}" \
            -f Dockerfile .

      - name: Construir y publicar frontend + Nginx
        run: |
          docker buildx build --push \
            -t "$IMAGE_PREFIX/nginx:${{ github.sha }}" \
            -f nginx/Dockerfile \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_COGNITO_AUTHORITY="${{ vars.VITE_COGNITO_AUTHORITY }}" \
            --build-arg VITE_COGNITO_CLIENT_ID="${{ vars.VITE_COGNITO_CLIENT_ID }}" \
            --build-arg VITE_COGNITO_REDIRECT_URI="${{ vars.VITE_COGNITO_REDIRECT_URI }}" \
            .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Empaquetar despliegue
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          NGINX_IMAGE: ${{ env.IMAGE_PREFIX }}/nginx:${{ github.sha }}
        run: bash scripts/package_deploy.sh dist/sigrif-deploy.tar.gz

      - name: Subir bundle a S3
        run: |
          aws s3 cp dist/sigrif-deploy.tar.gz \
            "s3://${{ vars.S3_BUCKET }}/deploy/${{ github.sha }}.tar.gz"

      - name: Desplegar por SSM
        run: |
          bash scripts/ssm_deploy.sh \
            "${{ vars.INSTANCE_ID }}" \
            "${{ vars.S3_BUCKET }}" \
            "deploy/${{ github.sha }}.tar.gz" \
            "${{ vars.AWS_REGION }}"
