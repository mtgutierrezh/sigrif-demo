name: sigrif

services:
  db:
    image: postgis/postgis:16-3.4
    env_file:
      - /opt/sigrif/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/db
        awslogs-stream: postgres

  ia:
    image: ${BACKEND_IMAGE:-sigrif-backend:latest}
    command: uvicorn sigrif.ia.main:app --host 0.0.0.0 --port 8001
    env_file:
      - /opt/sigrif/.env
    environment:
      APP_COLOR: shared
      SIGRIF_MODEL_PATH: /app/artifacts/risk_model.joblib
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-false}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
      OCR_MAX_BYTES: ${OCR_MAX_BYTES:-5242880}
      OCR_MAX_TOKENS: ${OCR_MAX_TOKENS:-1500}
    volumes:
      - /opt/sigrif/artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/ia
        awslogs-stream: ia

  api-blue:
    image: ${BACKEND_IMAGE:-sigrif-backend:latest}
    command: uvicorn sigrif.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - /opt/sigrif/.env
    environment:
      APP_COLOR: blue
      IA_URL: http://ia:8001
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/api
        awslogs-stream: api-blue

  api-green:
    image: ${BACKEND_IMAGE:-sigrif-backend:latest}
    command: uvicorn sigrif.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - /opt/sigrif/.env
    environment:
      APP_COLOR: green
      IA_URL: http://ia:8001
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/api
        awslogs-stream: api-green

  seed:
    image: ${BACKEND_IMAGE:-sigrif-backend:latest}
    command: python -m sigrif.worker.main
    env_file:
      - /opt/sigrif/.env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/api
        awslogs-stream: seed

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - /opt/sigrif/certbot/conf:/etc/letsencrypt
      - /opt/sigrif/certbot/www:/var/www/certbot
    profiles: ["tools"]

  nginx:
    image: ${NGINX_IMAGE:-sigrif-nginx:latest}
    env_file:
      - /opt/sigrif/.env
    environment:
      API_HOST: api-blue:8000
      SERVER_NAME: ${DOMAIN}
      LISTEN_PORT: "80"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/sigrif/certbot/conf:/etc/letsencrypt:ro
      - /opt/sigrif/certbot/www:/var/www/certbot:ro
      - /opt/sigrif/nginx/upstream:/etc/nginx/upstream
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /sigrif/prod/nginx
        awslogs-stream: nginx

volumes:
  pgdata:
