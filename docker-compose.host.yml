services:
  db:
    image: postgis/postgis:16-3.4
    network_mode: host
    command: ["postgres", "-p", "55432"]
    environment:
      POSTGRES_DB: sigrif
      POSTGRES_USER: sigrif
      POSTGRES_PASSWORD: sigrif
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigrif -d sigrif -p 55432"]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    network_mode: host
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      network: host
    network_mode: host
    command: uvicorn sigrif.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://sigrif:sigrif@localhost:55432/sigrif
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  ia:
    build:
      context: .
      network: host
    network_mode: host
    command: uvicorn sigrif.ia.main:app --host 0.0.0.0 --port 8001
    environment:
      DATABASE_URL: postgresql+psycopg://sigrif:sigrif@localhost:55432/sigrif
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: nginx
      network: host
    network_mode: host
    environment:
      API_HOST: localhost:8000
      LISTEN_PORT: "8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
